name: Android Build (Profile Feature)

on:
  push:
    branches: [ "main", "master", "feature/profiles" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ermöglicht manuellen Start im GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (Skip detekt & lint)
      # Überspringt detekt und lint, da diese im Upstream bereits fehlschlagen
      # und nichts mit der neuen Profil-Funktionalität zu tun haben.
      # Der Kotlin-Compiler läuft trotzdem - Syntaxfehler werden korrekt erkannt.
      run: ./gradlew assembleFdroidFullDebug --no-daemon -x detekt -x lint

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: rethinkdns-profile-debug
        path: app/build/outputs/apk/fdroid/full/debug/*.apk
        if-no-files-found: error

    - name: Run Unit Tests
      # Führt nur lokale Unit Tests aus (keine Instrumented Tests, da kein Emulator)
      run: ./gradlew testFdroidFullDebugUnitTest --no-daemon -x detekt -x lint
