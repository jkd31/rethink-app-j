name: Android Build (Profile Feature)

on:
  push:
    branches: [ "main", "master", "feature/profiles" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Ermöglicht manuellen Start im GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Build Debug APK (Full Flavor)
      # Wir bauen die 'fullDebug' Variante, da diese meist alle Features enthält
      # und am schnellsten zu bauen ist für Tests.
      run: ./gradlew assembleFdroidFullDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-profile-feature
        path: app/build/outputs/apk/fdroid/full/debug/*.apk
        if-no-files-found: error

    - name: Run Unit Tests
      # Führt nur lokale Unit Tests aus (keine Instrumented Tests, da kein Emulator)
      run: ./gradlew testFdroidFullDebugUnitTest --no-daemon
